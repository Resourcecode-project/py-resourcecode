name: Publish Resourcecode 📦 to PyPI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # Déclenche uniquement pour les tags commençant par 'v'

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        version: ""
        enable-cache: true
    - name: Build a binary wheel and a source tarball
      run: uv build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: resourcecode
        path: dist/

  verify-version:
    name: Verify package version
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: resourcecode
        path: dist/
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install package in development mode
      run: pip install -e .
    - name: Verify version consistency
      run: |
        # Extraire la version du package installé
        PACKAGE_VERSION=$(python -c "import resourcecode; print(resourcecode.__version__)")
        TAG_VERSION=${GITHUB_REF#refs/tags/v}

        echo "Tag version: $TAG_VERSION"
        echo "Package version: $PACKAGE_VERSION"

        if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
          echo "ERROR: Version mismatch between tag ($TAG_VERSION) and package ($PACKAGE_VERSION)"
          exit 1
        fi

        # Vérifie que la version existe déjà sur PyPI
        EXISTS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/resourcecode/$TAG_VERSION/json")
        if [ "$EXISTS" -ne 404 ]; then
          echo "ERROR: Version $TAG_VERSION already exists on PyPI"
          exit 1
        fi

  publish-to-pypi:
    name: Publish Resourcecode 📦 to PyPI
    needs:
    - build
    - verify-version
    runs-on: ubuntu-latest
    environment:
      name: publish
      url: https://pypi.org/p/resourcecode
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: resourcecode
        path: dist/
    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.11.16"
    - name: Publish Resourcecode 📦 to PyPI
      run: uv publish

  github-release:
    name: Sign the Resourcecode 📦 with Sigstore and upload to GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - uses: actions/checkout@v6
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: resourcecode
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v1.2.3
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create
        '${{ github.ref_name }}'
        --repo '${{ github.repository }}'
        --notes "Release ${{ github.ref_name }}"
        --generate-notes
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release upload
        '${{ github.ref_name }}' dist/**
        --repo '${{ github.repository }}'
